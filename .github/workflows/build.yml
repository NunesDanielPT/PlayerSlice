name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache FFmpeg
        id: ffcache
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg
          # chave fixa = versão do FFmpeg congelada; mudar o sufixo para atualizar
          key: ffmpeg-lgpl-shared-2026-11

      - name: Descarregar FFmpeg (LGPL, shared)
        if: steps.ffcache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/get-deps.ps1

      - name: Configurar
        run: cmake -S . -B build -A x64 -DFFMPEG_DIR="${{ github.workspace }}/third_party/ffmpeg"

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Empacotar
        shell: pwsh
        run: |
          $dist = "dist/PLAYERSLICE"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item build/Release/PLAYERSLICE.exe $dist
          Copy-Item build/Release/*.dll $dist
          Copy-Item README.md $dist
          Copy-Item third_party/ffmpeg/LICENSE.txt "$dist/FFmpeg-LICENSE.txt"
          Compress-Archive -Path "$dist/*" -DestinationPath dist/PLAYERSLICE-win64.zip -Force

      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          } else { $iscc = "iscc" }
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc installer/playerslice.iss

      - uses: actions/upload-artifact@v4
        with:
          name: PLAYERSLICE-win64
          path: |
            dist/PLAYERSLICE-win64.zip
            dist/PLAYERSLICE-Setup.exe

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PLAYERSLICE-win64.zip
            dist/PLAYERSLICE-Setup.exe
