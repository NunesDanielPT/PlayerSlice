name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache FFmpeg
        id: ffcache
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg
          # chave fixa = versão do FFmpeg congelada; mudar o sufixo para atualizar
          key: ffmpeg-lgpl-shared-2026-11

      - name: Descarregar FFmpeg (LGPL, shared)
        if: steps.ffcache.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./scripts/get-deps.ps1

      - name: Verificar shaders (fxc)
        run: python scripts/check_shaders.py

      - name: Verificar traduções (PT/EN)
        run: python scripts/i18n_en.py

      - name: Versão (do CMakeLists)
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path CMakeLists.txt -Pattern 'project\(PLAYERSLICE VERSION ([0-9.]+)'
          "version=$($m.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - name: Configurar
        run: cmake -S . -B build -A x64 -DFFMPEG_DIR="${{ github.workspace }}/third_party/ffmpeg"

      - name: Compilar
        run: cmake --build build --config Release --parallel

      - name: Empacotar
        shell: pwsh
        run: |
          $dist = "dist/PLAYERSLICE"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item build/Release/PLAYERSLICE.exe $dist
          Copy-Item build/Release/*.dll $dist
          Copy-Item README.md $dist
          Copy-Item third_party/ffmpeg/LICENSE.txt "$dist/FFmpeg-LICENSE.txt"
          Compress-Archive -Path "$dist/*" -DestinationPath dist/PLAYERSLICE-win64.zip -Force

      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          } else { $iscc = "iscc" }
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer/playerslice.iss

      - uses: actions/upload-artifact@v4
        with:
          name: PLAYERSLICE-win64
          path: |
            dist/PLAYERSLICE-win64.zip
            dist/PLAYERSLICE-Setup.exe

      - name: Publicar release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: PLAYERSLICE ${{ steps.ver.outputs.version }}
          make_latest: true
          # texto da release (as versões antigas da app precisam que não venha vazio)
          body: |
            PLAYERSLICE ${{ steps.ver.outputs.version }} — player de vídeo para ecrãs LED fora de formato.
            As novidades estão na app em Ajuda → Novidades desta versão.
            Criado por Daniel Nunes — github.com/NunesDanielPT
          files: |
            dist/PLAYERSLICE-win64.zip
            dist/PLAYERSLICE-Setup.exe
